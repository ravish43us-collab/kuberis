<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kuberis Canada — AI-assisted tax filing for Canadians."><title>Contact | Kuberis Canada</title><link rel="stylesheet" href="styles.css"></head><body>
<div data-site-header></div>
<main class="contact-page">
  <section class="page-hero contact-page-hero">
    <div class="container fade">
      <div class="kicker">01 — Get in touch</div>
      <h1>Let's turn tax stress <em>into confidence.</em></h1>
    </div>
  </section>

  <section class="section contact-main-section">
    <div class="container contact-layout">
      <div class="contact-form-wrap fade">
        <form class="contact-form-modern" onsubmit="event.preventDefault();alert('Prototype form submitted.');">
          <div class="contact-form-grid">
            <input required type="text" placeholder="Your name">
            <input required type="email" placeholder="Email address">
          </div>

          <div class="contact-subjects">
            <p>I'm here to…</p>
            <div class="contact-pill-row">
              <button type="button" class="contact-pill active">Start a return</button>
              <button type="button" class="contact-pill">Pricing question</button>
              <button type="button" class="contact-pill">Business &amp; LLC</button>
              <button type="button" class="contact-pill">Something else</button>
            </div>
          </div>

          <textarea rows="4" placeholder="Tell us a little about your situation…"></textarea>
          <button class="btn btn-red" type="submit">Send message <span>→</span></button>
        </form>
      </div>

      <aside class="contact-details-card fade">
        <h2 class="contact-details-title">Prefer to reach us directly?</h2>
        <div class="contact-detail-list">
          <div class="contact-detail-item">
            <div class="contact-detail-icon">✉</div>
            <div><span>Email</span><strong>admin@kuberis.ca</strong></div>
          </div>
          <div class="contact-detail-item">
            <div class="contact-detail-icon">✆</div>
            <div><span>Phone</span><strong>+1 (647) ***-0142</strong></div>
          </div>
          <div class="contact-detail-item">
            <div class="contact-detail-icon">⌖</div>
            <div><span>Studio</span><strong>Ontario, Canada</strong></div>
          </div>
          <div class="contact-detail-item">
            <div class="contact-detail-icon">◷</div>
            <div><span>Hours</span><strong>Mon–Sat · 8am–8pm ET</strong></div>
          </div>
        </div>
      </aside>
    </div>
  </section>
</main>
<div data-site-footer></div><script src="script.js"></script></body></html>
